<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B6B4A"/>
      <stop offset="100%" style="stop-color:#0D3D2B"/>
    </linearGradient>
    <linearGradient id="dna1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ADE80"/>
      <stop offset="100%" style="stop-color:#22C55E"/>
    </linearGradient>
    <linearGradient id="dna2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#D97706"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  
  <!-- DNA helix strands -->
  <g transform="translate(256,256)">
    <!-- Left strand -->
    <path d="M-60,-140 C-20,-100 20,-60 60,-20 C20,20 -20,60 -60,100 C-20,140 20,140 60,140" 
          fill="none" stroke="url(#dna1)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- Right strand -->
    <path d="M60,-140 C20,-100 -20,-60 -60,-20 C-20,20 20,60 60,100 C20,140 -20,140 -60,140" 
          fill="none" stroke="url(#dna2)" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Connection bars (base pairs) -->
    <line x1="-30" y1="-110" x2="30" y2="-110" stroke="#fff" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <line x1="-45" y1="-70" x2="45" y2="-70" stroke="#fff" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#fff" stroke-width="5" opacity="0.6" stroke-linecap="round"/>
    <line x1="-45" y1="30" x2="45" y2="30" stroke="#fff" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <line x1="-30" y1="70" x2="30" y2="70" stroke="#fff" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
    <line x1="-40" y1="115" x2="40" y2="115" stroke="#fff" stroke-width="5" opacity="0.4" stroke-linecap="round"/>
    
    <!-- Data dots -->
    <circle cx="-35" cy="-90" r="6" fill="#4ADE80" opacity="0.8"/>
    <circle cx="35" cy="-90" r="6" fill="#F59E0B" opacity="0.8"/>
    <circle cx="0" cy="-20" r="7" fill="#fff" opacity="0.9"/>
    <circle cx="-40" cy="50" r="6" fill="#4ADE80" opacity="0.8"/>
    <circle cx="40" cy="50" r="6" fill="#F59E0B" opacity="0.8"/>
  </g>
</svg>